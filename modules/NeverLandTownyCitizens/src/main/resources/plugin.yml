name: NeverLandTownyCitizens
version: 0.2.0
main: ru.neverland.townycitizens.NeverLandTownyCitizens
folia-supported: true
api-version: '26.2'
authors: [Alexander Sokolov]
description: Гражданство, временное проживание, городские права и паспортный API.
depend: [Towny]
softdepend: [PlaceholderAPI]
loadbefore: [NeverLandTownyBuilds, NeverLandTownyGovernance, NeverLandTownyTaxes]
commands:
  townycitizens:
    aliases: [nltcitizens, citizenship]
    description: Гражданство и городской реестр
    usage: /townycitizens [info|applications|terms|history|set|list|help|reload]
permissions:
  neverlandtownycitizens.use:
    default: true
  neverlandtownycitizens.apply:
    description: Подача заявления после подтверждения
    default: true
  neverlandtownycitizens.sponsor:
    description: Поручительство действующего гражданина своего города
    default: true
  neverlandtownycitizens.manage:
    description: Назначение статусов мэром своего города
    default: true
  neverlandtownycitizens.admin:
    description: Управление статусами в любом городе
    default: op
  neverlandtownycitizens.bypass:
    description: Обход ограничений гражданства на строительство и снос; права Towny сохраняются
    default: op
