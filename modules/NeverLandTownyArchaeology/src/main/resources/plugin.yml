name: NeverLandTownyArchaeology
version: 0.2.1
main: ru.neverland.archaeology.TownyArchaeology
folia-supported: true
api-version: '26.2'
authors: [Alexander Sokolov]
website: https://neverland.ru
description: Раскопки, артефакты, музейные коллекции и Чудеса Света проекта NeverLand.
provides: [TownyArchaeology]
depend: [Towny]
softdepend: [ItemsAdder, PlaceholderAPI]
commands:
  archaeology:
    aliases: [arch, археология]
    description: Археология, журнал и передача находок музею
    usage: /archaeology [journal|donate|nearest|collections|fragments|restore|search|history]
    permission: townyarchaeology.use
  townyarchaeology:
    aliases: [tarch, neverlandtownyarchaeology, nltarchaeology]
    description: Администрирование NeverLandTownyArchaeology
    usage: /townyarchaeology <reload|give|site|museum|info|restoration>
    permission: townyarchaeology.admin
  artifact:
    aliases: [artifacts, артефакт]
    description: Административная выдача артефактов
    usage: /artifact give <игрок> <артефакт> [количество]
permissions:
  townyarchaeology.use:
    default: true
  townyarchaeology.donate:
    default: true
  townyarchaeology.restore:
    description: Получение подписанных фрагментов и сборка целых артефактов
    default: true
  townyarchaeology.search:
    description: Поиск известных раскопок для выбранного артефакта
    default: true
  townyarchaeology.admin:
    default: op
    children:
      townyarchaeology.admin.give: true
  townyarchaeology.admin.give:
    description: Разрешает выдавать артефакты командой /artifact give
    default: op
  townyarchaeology.bypass:
    default: op
