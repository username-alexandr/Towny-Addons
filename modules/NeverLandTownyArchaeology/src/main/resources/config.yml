# ============================================================
# NeverLandTownyArchaeology — основные настройки
# ============================================================
generation:
  enabled: true
  # Пустой список разрешает все обычные миры, кроме blacklist.
  worlds: []
  world-blacklist: [world_nether, world_the_end]
  chance-per-new-chunk: 0.025
  minimum-distance-from-town: 96
  minimum-site-distance: 160
  attempts-per-site: 36
  maximum-saved-sites: 2000
  scan-interval-seconds: 30

museum:
  # Награда городу при первом завершении коллекции.
  collection-reward-money: 10000
  collection-reward-bonus-blocks: 3
  announce-completion: true

itemsadder:
  enabled: true

storage:
  autosave-seconds: 60

# Дополнительные фрагменты с настоящих раскопок. Прежний лут целых
# артефактов остаётся прежним: фрагменты добавляют отдельный ограниченный поток.
restoration:
  enabled: true
  chance-per-brushed-block: 0.15
  limits:
    # Скользящие 24 часа; 0 запрещает новые дополнительные находки.
    player-24h: 6
    server-24h: 120
    mailbox: 30
  search-radius: 5000
  # Нужны все РАЗНЫЕ части: 1/3, 2/3 и 3/3, а не три одинаковые.
  # Для уже найденных частей рецепт не меняется после изменения настроек.
  parts:
    common: 3
    uncommon: 4
    rare: 5
    epic: 6
    legendary: 8

gui:
  main-title: "&#18243AАрхеология"
  museum-title: "&#18243AГородской музей"
  journal-title: "&#18243AЖурнал археолога"
  collections-title: "&#18243AМузейные коллекции"
  wonders-title: "&#18243AАртефакты для чудес"
  filler: BLACK_STAINED_GLASS_PANE

# Светлый заголовок для тёмного ресурспака; для ванильного светлого окна: "#273247".
menu-style:
  title-color: "#F4F7FC"
