limits:
  districts-per-town: 32
  cells-per-district: 256
  selection-cells: 128
mob-farms:
  # Раздатчики действуют на враждебных мобов, когда оба участка разрешают мобов.
  dispenser-effects: true
  # Выключает меню и подсказки; сохранённые правила Towny остаются, фермы продолжают работать.
  enabled: true
  entry-notifications: true
# Все множители применяются только к завершённым зданиям в своём районе.
bonuses:
  matching-building: 0.15
  industrial-combination: 0.20
  maximum-multiplier: 2.0
  industrial-requires: [forge, foundry, warehouse]
# 15% + 20% = 35%, а не перемножение и не удвоение за каждый участник.
production:
  industrial-furnaces: true
  agricultural-crops: true

# Светлый заголовок для тёмного ресурспака; для ванильного светлого окна: "#273247".
menu-style:
  title-color: "#F4F7FC"

assessment:
  # Планирование не меняет прежние бонусы, цены и данные районов.
  enabled: true
  service-range-cells: 8
  # Необязательный assessment.services заменяет стандартные группы целиком.
  # services:
  #   residential:
  #     water:
  #       title: Водоснабжение
  #       buildings: [aqueduct, water_tower, reservoir]
