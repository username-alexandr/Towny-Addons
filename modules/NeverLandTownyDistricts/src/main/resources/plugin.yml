name: NeverLandTownyDistricts
version: 0.2.1
main: ru.neverland.townydistricts.NeverLandTownyDistricts
folia-supported: true
api-version: '26.2'
authors: [Alexander Sokolov]
description: Городские районы, размещение зданий и совместные бонусы.
depend: [Towny, NeverLandTownyBuilds]
commands:
  townyfarms:
    description: Карта защиты от мобов и зоны городских ферм
    usage: /townyfarms [map|list|show|status|allow|protect]
    aliases: [nltfarms]
  townydistricts:
    description: Управление городскими районами
    usage: /townydistricts [create|claim|unclaim|delete|rename|pos1|pos2|clear|map|info|reload]
    aliases: [districts, nltdistricts]
permissions:
  neverlandtownydistricts.use:
    default: true
  neverlandtownydistricts.manage:
    default: false
  neverlandtownydistricts.farms.manage:
    description: Управление защитой от мобов на отдельных участках своего города
    default: false
  neverlandtownydistricts.admin:
    default: op
