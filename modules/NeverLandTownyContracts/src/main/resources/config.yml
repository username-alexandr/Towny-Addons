contracts:
  max-active-per-town: 3
  max-active-server: 500
  allow-duplicate-template: false
  partial-payout-on-expire: true
  partial-payout-on-cancel: true
  expiration-check-seconds: 30
  history-limit-per-town: 30
  save-immediately: true

management:
  mayor: true
  allowed-town-ranks: [assistant]

warehouse:
  plugin: NeverLandTownyBuilds
  storage-size: 54
  block-deposits-while-open: true

economy:
  reserve-reason: "Резерв награды городского заказа: %contract%"
  payout-reason: "Награда за городской заказ: %contract%"
  refund-reason: "Возврат резерва городского заказа: %contract%"

gui:
  title: "&#241A33Доска городских заказов"
  history-title: "&#241A33История городских заказов"
  filler: BLACK_STAINED_GLASS_PANE

announcements:
  contract-start: true
  contract-complete: true
  contract-expire: true

# Муниципальные задания. Суммы — в монетах, срок — в реальных часах.
municipal:
  max-amount: 1000000
  max-reward: 1000000
  max-hours: 720
  road:
    materials: [COBBLESTONE, STONE_BRICKS, SMOOTH_STONE, GRAVEL, ANDESITE]
    max-blocks: 256
    stable-seconds: 60
  scout:
    max-chunks: 64
    dwell-seconds: 30
progress:
  allow-creative: false
