# Государственные заказы /orders. Городские контракты и их казна не затрагиваются.
catalog-version: 5
enabled: true
maximum-active: 3
board-size: 18
# У каждого игрока своя случайная подборка. Обновление — ежедневно в 00:00 Europe/Moscow.
# Личная доска сохраняется в orders-boards/<UUID>.yml; перезаход и рестарт её не меняют.
# После полуночи новая подборка создаётся при следующем обращении игрока к /orders.
# Отдельные задания у разных игроков могут совпадать, поскольку каталог общий.
# Вес относится к каждому шаблону, а не является процентом появления.
# 0 исключает редкость из следующих подборок. Все четыре вида представлены,
# если board-size >= 4 и для каждого вида есть шаблон с положительным весом.
rarity-weights:
  COMMON: 60
  UNCOMMON: 30
  RARE: 12
  EPIC: 4
  LEGENDARY: 1
limits:
  player-24h: 3000
  server-24h: 100000
# Лимиты — суммы за скользящие 24 часа, а не размер одной награды.
# Можно увеличить общий лимит выше 1 000 000; максимум — 1000000000000 монет.
# Значение пишется числом без кавычек и пробелов, максимум 2 знака после точки.
# Общий лимит должен быть не меньше личного. 0 и -1 не отключают лимит.
# Стартовый личный лимит для плейтеста; изменить при необходимости.
# Это скользящие 24 часа. Полночь не сбрасывает лимиты выплат.
# Срок задания учитывает время работы включённого модуля. Выход игрока
# не останавливает срок; остановка сервера/пауза модуля останавливает.
# Новые настройки каталога/весов вступают в силу на следующей дневной доске
# после перезапуска сервера. Принятые задания сохраняют свои условия.
# enabled: false внутри шаблона исключает его из следующих подборок.
# introduced-in — версия добавления штатного шаблона для миграции каталога.
