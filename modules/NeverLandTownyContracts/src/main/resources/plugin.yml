name: NeverLandTownyContracts
version: 0.3.26
main: ru.neverland.mintcontracts.MintTownyContracts
folia-supported: true
api-version: '26.2'
authors: [Alexander Sokolov]
website: https://neverland.ru
description: Городские заказы и совместные задания для экосистемы Towny проекта NeverLand.
provides: [MintTownyContracts]
depend: [Towny, NeverLandTownyBuilds]
softdepend: [NeverLandTownyReputation, PlaceholderAPI, ItemsAdder]
commands:
  orders:
    description: Государственные заказы для всех игроков
    usage: /orders [accept|mine|claim|cancel|admin]
    permission: neverland.orders.use
  townycontracts:
    description: Административное управление городскими заказами
    usage: /townycontracts <start|cancel|list|reload|payments|deliveries|resolve|resolve-delivery>
    aliases: [mintcontracts, mcontracts, neverlandtownycontracts, nltcontracts]
    permission: mintcontracts.admin
permissions:
  neverland.orders.use:
    default: true
  neverland.orders.admin:
    default: op
  mintcontracts.use:
    default: true
  mintcontracts.contribute:
    default: true
  mintcontracts.manage:
    default: true
  mintcontracts.admin:
    default: op
