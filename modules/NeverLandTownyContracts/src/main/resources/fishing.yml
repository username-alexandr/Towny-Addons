# Проверка личных и городских заданий. Начальные значения предназначены для плейтеста.
enabled: true
# false сохраняет обычную ванильную рыбалку игрокам без незавершённого рыболовного задания.
apply-without-task: false
habitat:
  # Нативная проверка открытой воды Minecraft; одиночный блок и тесная AFK-ферма не подходят.
  require-open-water: true
stock:
  # Общий запас для всех игроков. Расстояние считается между местами поплавков, без привязки к чанкам.
  radius: 24
  capacity: 20
  # Каждый вылов восстанавливается постепенно за это время. Рестарт не сбрасывает записи.
  recovery-seconds: 1800
# Запас резервируется перед уловом. Если рыба сорвалась, известный неудачный резерв возвращается.
reservation-seconds: 15
# Старые записи вылова удаляются после этого срока; активный запас не очищается.
# Административный журнал уловов хранится отдельно. Минимум 2 дня, максимум 365.
retention-days: 3
