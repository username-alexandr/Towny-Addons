# Сила новых набегов зависит от завершённых зданий города.
# Ничего не меняет в уже начавшемся набеге; его параметры сохраняются в events-data.yml.
enabled: true

# Очки развития = сумма уровней завершённых зданий × вес проекта.
# Незавершённое улучшение не считается. Остановка производства не уменьшает развитие.
# При этом количестве очков достигаются максимальные множители; дальше роста нет.
full-strength-score: 200
maximum:
  count: 2.5
  health: 2.0
  damage: 1.5
  # Ограничение добавленных врагов вместе с исходной волной.
  # Уже заданную администратором более крупную волну не урезаем.
  # Одновременный лимит мобов остаётся в config.yml: raid-max-alive-mobs-per-town.
  wave-size: 60

# Этих врагов усиление не размножает. Здоровье и урон повышаются как у остальных.
fixed-count-mobs: [captain]

# У обычных проектов вес 1. Чудо света с единственным уровнем оценивается выше.
# Можно добавить любой ID здания; вес 0 исключает его из расчёта силы набега.
project-weights:
  sun_pyramid: 10
  great_colosseum: 10
  alexandria_lighthouse: 10
  hanging_gardens: 10
  archmage_spire: 10
  rhodes_colossus: 10
  world_tree: 10
  celestial_orrery: 10
  terracotta_army: 10
  crystal_palace: 10
  great_canal: 10
