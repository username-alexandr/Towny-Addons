name: NeverLandTownyEvents
version: '0.2.3'
main: ru.neverland.mintevents.MintTownyEvents
api-version: '26.2'
authors: [Alexander Sokolov]
website: https://neverland.ru
description: Городские события для экосистемы Towny проекта NeverLand.
provides: [MintTownyEvents]
depend: [Towny]
softdepend: [ModelEngine, ItemsAdder, NeverLandTownyBuilds, NeverLandTownyIdeologies, PlaceholderAPI]
commands:
  townyevents:
    description: Административное управление городскими событиями
    usage: /townyevents <start|stop|list|raidwave|reload>
    aliases: [mintevents, mevents, neverlandtownyevents, nltevents]
    permission: mintevents.admin
permissions:
  mintevents.use:
    description: Просмотр событий своего города
    default: true
  mintevents.contribute:
    description: Внесение ресурсов в городское событие
    default: true
  mintevents.admin:
    description: Административное управление событиями
    default: op
