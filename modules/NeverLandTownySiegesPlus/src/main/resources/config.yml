# SiegeWar owns wars, sides, battle windows, scores and occupation.
# SiegeWar 3.6.2 is the existing siege integration; without it army raids use tnt.raid below.
battle-sessions-only: true
# Horizontal expansion beyond the completed building's actual footprint.
radius:
  fortress_wall: 12
  fortress_gate: 0
  city_moat: 3
  watchtower: 32
  watch_fortress: 24
  port_fort: 48
ground-height: 24
tower-height: 96
damage:
  wall-per-level: 0.05
  tower-per-level: 0.03
  # Includes optional Army defenseBonus, capped separately at 20%.
  maximum-reduction: 0.40
moat:
  slow-per-level: 0.10
  maximum-slow: 0.35
menu-style:
  title-color: '#F4F7FC'

# Прочность дверей и блоков во время объявленного рейда.
# Без SiegeWar: /sieges raid <город>, объявляет мобилизованный мэр или генерал.
# С SiegeWar: используются его стороны и активная боевая сессия, отдельный рейд не создаётся.
# Настройки Towny, взрывы и PvP на участках не переключаются.
tnt:
  enabled: true
  radius: 6.0
  # Полный урон до ближайшей грани блока в этом радиусе.
  contact-radius: 1.0
  contact-damage: 100.0
  # За contact-radius: damage * ((radius-distance)/(radius-contact-radius))^power.
  falloff-power: 2.0
  # Целый блок восстанавливает HP после затишья; уничтоженные блоки не откатываются.
  repair-after-seconds: 1800
  raid:
    warmup-seconds: 120
    duration-seconds: 1200
    cooldown-seconds: 86400
    minimum-defenders-online: 1
  hitpoints:
    default: 400.0
    wooden-door: 120.0
    iron-door: 400.0
    glass: 60.0
    wood: 200.0
    obsidian: 1200.0
    materials: {}
