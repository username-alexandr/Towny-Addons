# Camp mode uses army raids below. With camp.enabled=false, installed SiegeWar owns wars and battle windows.
# Existing SiegeWar 3.6.2 integration is retained for servers opting out of camp mode.
battle-sessions-only: true
# Horizontal expansion beyond the completed building's actual footprint.
radius:
  fortress_wall: 12
  fortress_gate: 0
  city_moat: 3
  watchtower: 32
  watch_fortress: 24
  port_fort: 48
ground-height: 24
tower-height: 96
damage:
  wall-per-level: 0.05
  tower-per-level: 0.03
  # Includes optional Army defenseBonus, capped separately at 20%.
  maximum-reduction: 0.40
moat:
  slow-per-level: 0.10
  maximum-slow: 0.35
menu-style:
  title-color: '#F4F7FC'

# Однократная добыча за основную кафедру завершённой ратуши во время рейда.
# Получатель — казна и общий склад атакующего города. Новая валюта не создаётся.
loot:
  enabled: true
  money-percent: 10.0
  resources-percent: 10.0
  defense:
    reduction-percent-per-level: 2.0
    maximum-reduction-percent: 75.0
    include-garrison: true

# Режим войны через физический осадный лагерь. Имеет приоритет над боями SiegeWar.
camp:
  enabled: true
  border-distance: 16
  muster-radius: 16
  minimum-army: 2
  lifetime-seconds: 86400

# Прочность дверей и блоков во время объявленного рейда.
# В режиме camp рейд запускается у лагеря: /sieges camp.
# При camp.enabled=false без SiegeWar: /sieges raid <город>.
# При camp.enabled=false с SiegeWar: используются его стороны и активная боевая сессия.
# Настройки Towny, взрывы и PvP на участках не переключаются.
tnt:
  enabled: true
  radius: 6.0
  # Полный урон до ближайшей грани блока в этом радиусе.
  contact-radius: 1.0
  contact-damage: 100.0
  # За contact-radius: damage * ((radius-distance)/(radius-contact-radius))^power.
  falloff-power: 2.0
  # Целый блок восстанавливает HP после затишья; уничтоженные блоки не откатываются.
  repair-after-seconds: 1800
  raid:
    # Пока город впервые не достроил здание армии I, он не может атаковать и быть целью рейда.
    # Снос армии, её временная остановка или проигранный рейд не возвращают эту защиту.
    # Действующий 24-часовой щит новичка также сохраняется.
    require-army-building: true
    warmup-seconds: 120
    duration-seconds: 1200
    cooldown-seconds: 86400
    minimum-defenders-online: 1
  hitpoints:
    default: 400.0
    wooden-door: 120.0
    iron-door: 400.0
    glass: 60.0
    wood: 200.0
    obsidian: 1200.0
    materials: {}

# Временный контроль Minecraft-чанков 16×16 во время армейского рейда.
# Постоянные флаги и владелец Towny не меняются. Права не переносятся в следующую войну.
war-chunks:
  enabled: true
  # Непрерывное удержание пустого участка мобилизованным нападающим в выживании.
  # Защитник, уход, смерть или пропущенные проверки сбрасывают отсчёт.
  empty-hold-seconds: 120

# Цель выбирается при объявлении рейда и сохраняется до его завершения.
# core — выдать добычу после разрушения кафедры, chunks — удержать указанное число участков.
war-objectives:
  chunks-required: 2

# Только армейские рейды. Защитник предлагает сумму из своей казны;
# нападающий подтверждает, после чего война останавливается до завершения перевода.
ransom:
  enabled: true
  maximum: 100000
  offer-seconds: 300

# До выбора мэром город открыт круглосуточно. Менять начатую войну расписание не может.
raid-hours:
  enabled: true
  timezone: Europe/Moscow
  default-start: '00:00'
  default-end: '00:00'
  minimum-hours: 4
  change-notice-hours: 24

# Снабжение оплачивает нападающий город. Запасы не пропадают при потере лагеря.
camp-supplies:
  enabled: true
  cargo-per-minute:
    BREAD: 2
    IRON_INGOT: 1
  # Запасной источник: единицы военных ресурсов /t army.
  army-per-minute:
    food: '1.000'
    metal: '0.250'
