name: NeverLandTownyQuests
version: 0.1.2
main: ru.neverland.townyquests.NeverLandTownyQuests
api-version: '26.2'
authors: [Alexander Sokolov]
description: Общие городские проекты с последовательными этапами и реформами.
depend: [Towny]
softdepend: [NeverLandTownyBuilds, NeverLandTownyDistricts, NeverLandTownyResources]
commands:
  townyquests:
    aliases: [nltquests, cityquests]
    description: Городские проекты
    usage: /townyquests [menu|info|start|reload|admin]
permissions:
  neverlandtownyquests.use:
    default: true
  neverlandtownyquests.manage:
    default: false
  neverlandtownyquests.admin:
    default: op
