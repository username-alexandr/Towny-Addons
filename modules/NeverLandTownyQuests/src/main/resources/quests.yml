# Начатые проекты сохраняют снимок своих условий. Порядок этапов имеет значение.
# Поддерживаются BUILDING (работающее здание) и WATER_DISTRICTS (районы с водой).
projects:
  sanitation:
    name: Вода и санитария
    icon: WATER_BUCKET
    requires: []
    unlock: sanitation_reform
    reward: 'Открывает санитарную реформу в /t policies: +5 счастья, +10% содержания санитарных зданий.'
    stages:
      aqueduct:
        name: Построить действующий акведук
        type: BUILDING
        building: aqueduct
        target: 1
      water:
        name: Обеспечить водой пять районов
        type: WATER_DISTRICTS
        target: 5
        hold-seconds: 300
      baths:
        name: Открыть городские бани
        type: BUILDING
        building: baths
        target: 1
  public_health:
    name: Городское здравоохранение
    icon: GOLDEN_APPLE
    requires: [sanitation]
    unlock: public_health
    reward: 'Открывает общественное здравоохранение в /t policies: +8 счастья, +20% содержания санитарных зданий.'
    stages:
      sewer:
        name: Построить канализацию
        type: BUILDING
        building: sewer
        target: 1
      infirmary:
        name: Открыть городскую лечебницу
        type: BUILDING
        building: infirmary
        target: 1
      water:
        name: Поддерживать воду в пяти районах
        type: WATER_DISTRICTS
        target: 5
        hold-seconds: 600

  industrial_future:
    name: Индустриальное продолжение
    icon: BLAST_FURNACE
    requires: [sanitation]
    choice-group: city_future
    unlock: industrial_future
    reward: 'Открывает в /t policies инновационную промышленность: выпуск +20%, содержание +10%. Альтернатива зелёному городу.'
    stages:
      workshop:
        name: Развить мастерскую
        type: BUILDING
        building: workshop
        target: 2
      forge:
        name: Модернизировать кузницу
        type: BUILDING
        building: forge
        target: 2
      power:
        name: Открыть электростанцию
        type: BUILDING
        building: power_station
        target: 1
  green_future:
    name: Зелёное продолжение
    icon: FLOWERING_AZALEA
    requires: [sanitation]
    choice-group: city_future
    unlock: green_future
    reward: 'Открывает в /t policies зелёный стандарт: довольство +6, выпуск сельского хозяйства +15%, его содержание +10%. Альтернатива индустриальному городу.'
    stages:
      park:
        name: Развить городской парк
        type: BUILDING
        building: park
        target: 2
      forestry:
        name: Развить лесничество
        type: BUILDING
        building: forestry
        target: 2
      recycling:
        name: Открыть перерабатывающий двор
        type: BUILDING
        building: recycling_yard
        target: 1
