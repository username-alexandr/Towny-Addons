name: NeverLandTownyCrime
version: 0.2.1
main: ru.neverland.townycrime.NeverLandTownyCrime
folia-supported: true
api-version: '26.2'
authors: [Alexander Sokolov]
description: Преступность, городская стража, потери лавок и кражи виртуальных ресурсов.
depend: [Towny, NeverLandTownyBuilds, NeverLandTownyPopulation]
softdepend: [NeverLandTownyJobs, NeverLandTownyResources, NeverLandTownyDistricts, NeverLandTownyCouncil, PlaceholderAPI]
commands:
  townycrime:
    aliases: [nltcrime, citycrime]
    description: Преступность города
    usage: /townycrime [menu|help|town <город>|reload]
permissions:
  neverlandtownycrime.use:
    default: true
  neverlandtownycrime.manage:
    description: Назначение патрулей; дополнительно требуется мэр или городской суд
    default: true
  neverlandtownycrime.admin:
    default: op
