# Загрязнение 0–100. Цикл учитывает только работу сервера.
# Нагрузка за каждый завершённый действующий уровень здания.
# Недоступные данные/пауза: загрязнение сохранено, штрафы отключены.
# Сельскохозяйственный коэффициент применяется только к выпуску FOOD.
