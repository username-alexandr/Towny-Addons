name: NeverLandTownyResearch
version: 0.2.1
main: ru.neverland.townyresearch.NeverLandTownyResearch
folia-supported: true
api-version: '26.2'
authors: [Alexander Sokolov]
description: Городские исследования, знания и технологии.
depend: [Towny, NeverLandTownyBuilds, NeverLandTownyResources]
softdepend: [NeverLandTownyTreasuryPlus, NeverLandTownyPower, NeverLandTownyUpkeep, PlaceholderAPI]
commands:
  townyresearch:
    aliases: [nltresearch, cityresearch]
    description: Исследования города
    usage: /townyresearch [info|start|cancel|reload]
permissions:
  neverlandtownyresearch.use:
    default: true
  neverlandtownyresearch.manage:
    default: false
  neverlandtownyresearch.admin:
    default: op
  neverlandtownyresearch.licenses:
    description: Просмотр и управление технологическими лицензиями в рамках городской должности
    default: true
