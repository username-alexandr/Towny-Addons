# Один исследовательский проект на город. Время учитывается только при работе сервера.
# Очки знаний — существующий стратегический ресурс knowledge из Resources.
simulation:
  interval-seconds: 5

# Светлый заголовок для тёмного ресурспака; для ванильного светлого окна: "#273247".
