# Условия и награды закрепляются за городом при первой проверке.
# Изменения существующего ID применяются только к новым городам; для новой цели используйте новый ID.
# Ступени — самостоятельные цели: завершённая высокая ступень не отнимается при снижении показателя.
# Профильные цели доступны любому городу, независимо от выбранной специализации.
