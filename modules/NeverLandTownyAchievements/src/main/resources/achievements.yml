# Условия и награды закрепляются за городом при первой проверке.
# Изменения существующего ID применяются только к новым городам; для новой цели используйте новый ID.
achievements:
  first_million:
    name: Первый миллион
    description: Накопите миллион монет в городской казне.
    icon: GOLD_INGOT
    kind: BALANCE
    target: 1000000
    reward:
      title: Город миллионеров
      cosmetic: spark
      banner: wealth
      happiness: 0
