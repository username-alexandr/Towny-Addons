# Частота автоматической проверки городов; 1–3600 секунд.
check-seconds: 30
# Личные эффекты частиц можно выключить без потери открытых наград.
cosmetics-enabled: true

# Подключать новые стандартные цели, отсутствующие в вашем achievements.yml.
# Ваши существующие ID и закреплённые городские награды не изменяются.
include-new-default-goals: true
