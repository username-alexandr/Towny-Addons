name: NeverLandTownyPower
version: 0.2.2
main: ru.neverland.townypower.NeverLandTownyPower
folia-supported: true
api-version: '26.2'
authors: [Alexander Sokolov]
description: Энергетическая ветка развития, мощность города и питание зданий.
depend: [Towny, NeverLandTownyBuilds]
softdepend: [NeverLandTownyUpkeep, NeverLandTownyDistricts, PlaceholderAPI]
commands:
  townypower:
    aliases: [nltpower, citypower]
    description: Энергоснабжение города
    usage: /townypower [generators|consumers|info|pause|resume|priority|emergency|reload]
permissions:
  neverlandtownypower.use:
    default: true
  neverlandtownypower.manage:
    default: false
  neverlandtownypower.admin:
    default: op
