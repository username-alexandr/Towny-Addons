# Мощность — расход за секунду. Накопители хранят запас в единицах мощности × секунды.
simulation:
  refresh-seconds: 5

# Встроенные накопители при генераторе и электростанции. Новых зданий и цен не добавляет.
# Запас начинает расти с нуля. Во время остановки сервера энергия не производится.
accumulators:
  max-charge-power: 200
  max-discharge-power: 200
  capacities:
    generator: [0, 0, 30000, 60000, 120000]
    power_station: [0, 0, 120000, 240000, 480000]

# Светлый заголовок для тёмного ресурспака; для ванильного светлого окна: "#273247".
menu-style:
  title-color: "#F4F7FC"
