# Срок договора отсчитывается от принятия; условия фиксируются в предложении.
default-days: 30
maximum-days: 365
proposal-hours: 72
# Защитные договоры продолжают действовать после запроса расторжения.
termination-notice-hours: 24
# Скидка только на пошлины городов — сторон торгового договора.
# Цена товара и пошлины третьих городов не меняются.
trade-discount-percent: 25
maximum-open-per-town: 64
incident-cooldown-seconds: 300
