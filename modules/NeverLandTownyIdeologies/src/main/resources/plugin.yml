name: NeverLandTownyIdeologies
version: 0.2.2
main: ru.neverland.townyideologies.NeverLandTownyIdeologies
folia-supported: true
api-version: '26.2'
authors: [Alexander Sokolov]
website: https://neverland.ru
description: Идеологии и развитие городов Towny проекта NeverLand.
depend: [Towny]
softdepend: [ItemsAdder, Vault, PlaceholderAPI]
commands:
  townyideologies:
    description: Администрирование городских идеологий
    usage: /townyideologies <reload|info|set|reset|reform|sync-payment|retry-payment|reconcile>
    aliases: [nlti, neverlandtownyideologies]
    permission: neverlandtownyideologies.admin
permissions:
  neverlandtownyideologies.use:
    default: true
  neverlandtownyideologies.select:
    default: true
  neverlandtownyideologies.upgrade:
    default: true
  neverlandtownyideologies.admin:
    default: op
