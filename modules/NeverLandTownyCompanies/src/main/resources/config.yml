# Все суммы ниже в копейках: 10000 = 100.00 монет.
# Изменения применяются после перезапуска, только к следующему начислению.
tax:
  interval-hours: 24
  cents:
    shop: 10000
    mine: 15000
    farm: 7500
    transport: 12500
# После простоя начисляется один период. При долге новый налог не накапливается.
# Личные счета участников автоматически не используются.
limits:
  companies: 2000
  per-town: 20
  members: 20
  contracts: 3
