# Payroll is separate from profession XP, careers, workplaces and building bonuses.
# A restart is required after editing this file.
enabled: true
limits:
  player-24h: 350
  server-24h: 25000
level-multipliers: [1.00, 1.05, 1.10, 1.15, 1.20]
minimum-action-seconds: 5
# Per confirmed operation, NOT per stack or per second.
pay:
  blacksmith: 1.20 # extract smelted metal with smelting XP
  farmer: 0.40 # harvest a crop whose natural final growth was observed
  engineer: 2.00 # craft piston/dispenser/dropper/repeater/comparator
  guard: 1.50 # direct kill of a naturally spawned hostile; move >=4 blocks between kills
  merchant: 2.00 # sell goods for emeralds to a villager; recipe-use proof
  researcher: 3.00 # completed enchantment; same item type/enchantments paid once per day
  alchemist: 3.00 # brewing completed after manually increasing ingredient slot
