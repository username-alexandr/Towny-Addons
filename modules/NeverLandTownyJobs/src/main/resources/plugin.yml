name: NeverLandTownyJobs
version: 0.3.0
main: ru.neverland.townyjobs.NeverLandTownyJobs
folia-supported: true
api-version: '26.2'
authors: [Alexander Sokolov]
description: Профессии жителей, рабочие места и эффективность городских зданий.
depend: [Towny, NeverLandTownyBuilds]
softdepend: [NeverLandTownyCompanies]
commands:
  jobpay:
    description: Зарплата за работу и сверка начислений
    usage: /jobpay [status|admin]
  townyjobs:
    aliases: [nltjobs]
    description: Городские профессии
    usage: /townyjobs [help|choose|work|duty|leave|staff|mastery|admin]
permissions:
  neverlandtownyjobs.mastery:
    default: true
  neverlandtownyjobs.earn:
    default: true
  neverlandtownyjobs.payments:
    default: op
  neverlandtownyjobs.use:
    default: true
  neverlandtownyjobs.work:
    default: true
  neverlandtownyjobs.manage:
    default: op
  neverlandtownyjobs.admin:
    default: op
