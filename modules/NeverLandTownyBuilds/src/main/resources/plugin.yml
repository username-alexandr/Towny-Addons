name: NeverLandTownyBuilds
version: '0.8.11'
main: ru.neverland.townybuilds.NeverLandTownyBuilds
api-version: '26.2'
authors: [Alexander Sokolov]
website: https://neverland.ru
description: Городские здания, Чудеса Света, склад и эффекты проекта NeverLand.
depend: [Towny]
softdepend: [ItemsAdder, PlaceholderAPI]
commands:
  townyarmy:
    description: Состав армии и мобилизация граждан с 18 лет персонажа
    usage: /townyarmy [list|mobilize|release|age]
  buildeditor:
    description: Внутриигровой редактор городских построек
    usage: /buildeditor
    aliases: [minteditor, townybuildeditor]
    permission: neverlandtownybuilds.admin.editor
  townybuilds:
    description: Административные команды NeverLandTownyBuilds
    usage: /townybuilds reload
    aliases: [nltb, neverlandtownybuilds]
    permission: neverlandtownybuilds.admin
permissions:
  neverlandtownybuilds.army.use:
    default: true
  neverlandtownybuilds.army.mobilize:
    description: Управление армией своего города помимо мэра
    default: op
  neverlandtownybuilds.army.age:
    description: Подтверждение возраста персонажа администратором
    default: op
  neverlandtownybuilds.army.soldier:
    description: Временный статус действующего мобилизованного гражданина
    default: false
  neverlandtownybuilds.use:
    default: true
  neverlandtownybuilds.upgrade:
    default: true
  neverlandtownybuilds.civic:
    description: Муниципальные службы, территории и городская лавка
    default: true
  neverlandtownybuilds.admin:
    default: op
  neverlandtownybuilds.admin.editor:
    default: op
  neverlandtownybuilds.admin.bypass:
    description: Позволяет ломать защищённые блоки процедурных зданий
    default: op
