# Собственные здания Sponge .schem v2/v3. Без записей используются прежние чертежи.
schema: 1
memory:
  maximum-cells: 16000000
  preview-blocks: 100000
# Файлы размещаются в NeverLandTownyBuilds/blueprints/source/.
# Вход здания направлен на север. Низ схемы — уровень земли; сохранённый Offset не применяется.
# По умолчанию точка установки — центр нижнего слоя. Можно указать origin: [x, z] внутри схемы.
# Все 5 уровней обычного здания (или 1 уровень Чуда) должны быть указаны вместе.
# Улучшение сохраняет прежние блоки на тех же местах и добавляет новые этажи/пристройки.
# Замена и удаление прежних блоков при улучшении не поддерживаются; такие схемы отклоняются.
# В каждом уровне ратуши нужна ровно одна кафедра. Существа и предметы-сущности запрещены.
# Импортируются блоки и их состояния; содержимое контейнеров и прочий NBT не переносится.
# Цены и ресурсные требования здания не меняются.
projects: {}
# Пример вместо projects: {}:
# projects:
#   town_hall:
#     medieval:
#       levels:
#         '1': medieval/town_hall/1.schem
#         '2': medieval/town_hall/2.schem
#         '3': medieval/town_hall/3.schem
#         '4': medieval/town_hall/4.schem
#         '5':
#           file: medieval/town_hall/5.schem
#           origin: [15, 15]
# Стиль: medieval, modern или fantasy. ID зданий — из projects.yml.
# Новые версии загружаются только после полного перезапуска. Проверка: /townybuilds blueprints
# Не удаляйте blueprints/versions/: сохранённые стройки, ремонт и откаты используют эти файлы.
