settings:
  resources:
    # Объём этапа × 1.15 для зданий, × 1.35 для чудес; редкие ресурсы имеют больший вес.
    # Количества в projects.yml задают пропорции. custom-projects.yml сохраняет точные цены.
    blueprint-budget: true
  effects:
    # GLOBAL — во всех мирах; TOWN — только внутри территории своего города.
    scope: GLOBAL
    refresh-ticks: 200
    duration-ticks: 400
    ambient: true
    particles: false
    icon: true
  storage:
    size: 54
    autosave-seconds: 60
  construction:
    # Мэр начинает этап здания или Чуда, наведясь на землю в пределах города. Последующие уровни используют ту же площадку.
    target-distance: 16
    validation-max-errors: 5
    obstacle-preview-seconds: 90
    preview-enabled: true
    preview-interval-ticks: 10
    preview-distance: 64
    # Ближайший требуемый блок выделяется контуром; больше точек делают чертёж нечитаемым.
    guide-points-per-edge: 4
    # Персональная подпись над ближайшей точкой: название блока, координаты и расстояние.
    guide-label-enabled: true
    guide-label-height: 1.35
  civic:
    # Автоматизация работает только в уже загруженных чанках и никогда не загружает их принудительно.
    automation-interval-ticks: 1200
    # Максимальная длина стены, рва или дамбы: значение умножается на уровень проекта.
    linear-blocks-per-level: 32
    spawn-shops:
      # Администратор создаёт точки командой /townybuilds stall set <id>.
      claim-radius: 8
      browse-radius: 8
      maximum-unit-price: 1000000
      # Только обычные ванильные предметы без имени, lore, зачарований и PDC можно продать.
      allowed-materials:
        - COBBLESTONE
        - STONE
        - STONE_BRICKS
        - OAK_LOG
        - SPRUCE_LOG
        - BIRCH_LOG
        - OAK_PLANKS
        - SPRUCE_PLANKS
        - COAL
        - COPPER_INGOT
        - IRON_INGOT
        - GOLD_INGOT
        - REDSTONE
        - LAPIS_LAZULI
        - DIAMOND
        - EMERALD
        - QUARTZ
        - WHEAT
        - CARROT
        - POTATO
        - BEETROOT
        - BREAD
        - LEATHER
        - PAPER
        - BOOK
        - HONEYCOMB
        - STRING
        - BONE
        - ARROW
        - GLASS
      stalls: {}
  economy:
    withdraw-reason: "Развитие городской постройки: {project} уровень {level}"
  announcements:
    wonder-complete: true
    fireworks: true
    firework-count: 8
  itemsadder:
    enabled: true
    # Необязательные предметы для рамок и кнопок GUI.
    filler-item: "neverland:menu_filler"
    back-item: "neverland:menu_back"
    upgrade-item: "neverland:menu_upgrade"
    locked-item: "neverland:menu_locked"
  editor:
    chat-input-timeout-seconds: 60

# Армия использует возраст персонажа, а не реальный возраст игрока.
army:
  soldiers-per-level: 10
  # Если подключён RP-паспорт через PlaceholderAPI, укажите его возрастной placeholder.
  # Пусто: ResidentAgeProvider через Bukkit ServicesManager или /townyarmy age.
  # Неизвестный/ошибочный возраст запрещает мобилизацию.
  age-placeholder: ""
