name: Events hotfix

on:
  pull_request:
    paths:
      - 'modules/NeverLandTownyEvents/**'
      - 'scripts/safety-runtime-probe/**'
      - '.github/workflows/build-events-hotfix.yml'

permissions:
  contents: read

jobs:
  events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'
      - run: python scripts/build_suite.py Events --stage dist/plugins
      - uses: actions/upload-artifact@v4
        with:
          name: NeverLandTownyEvents-hotfix
          path: dist/plugins/NeverLandTownyEvents-*.jar
          if-no-files-found: error
