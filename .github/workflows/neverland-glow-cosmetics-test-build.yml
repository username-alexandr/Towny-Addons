name: NeverLandGlowCosmetics Test Build

on:
  push:
    branches:
      - chatgpt/neverland-glow-cosmetics-test-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Reconstruct sources
        shell: bash
        run: |
          rm -rf .ci-glow-work
          mkdir -p .ci-glow-work
          base64 -d ci/NeverLandGlowCosmetics/source.tar.b64 > /tmp/NeverLandGlowCosmetics-source.tar.gz
          tar -xzf /tmp/NeverLandGlowCosmetics-source.tar.gz -C .ci-glow-work
      - name: Build plugin
        working-directory: .ci-glow-work/NeverLandGlowCosmetics
        run: gradle --no-daemon clean build
      - name: Validate jar
        shell: bash
        run: |
          JAR=$(find .ci-glow-work/NeverLandGlowCosmetics/build/libs -maxdepth 1 -name '*.jar' ! -name '*sources*' | head -n1)
          test -n "$JAR"
          jar tf "$JAR" | grep -q '^plugin.yml$'
          jar tf "$JAR" | grep -q 'ru/neverland/glowcosmetics/NeverLandGlowCosmeticsPlugin.class'
          mkdir -p /tmp/glow-artifact
          cp "$JAR" /tmp/glow-artifact/NeverLandGlowCosmetics-0.2.0-test.jar
          sha256sum /tmp/glow-artifact/NeverLandGlowCosmetics-0.2.0-test.jar > /tmp/glow-artifact/NeverLandGlowCosmetics-0.2.0-test.jar.sha256
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: NeverLandGlowCosmetics-0.2.0-test
          path: /tmp/glow-artifact/*
          retention-days: 7
