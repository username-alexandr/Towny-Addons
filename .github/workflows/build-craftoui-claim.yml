name: CraftoUI claim map integration

on:
  pull_request:
    paths:
      - 'integrations/CraftoUI-0.9.22/**'
      - '.github/workflows/build-craftoui-claim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build server and run tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/craftoui /tmp/no-minecraft
          tar -xJf integrations/CraftoUI-0.9.22/craftoui-source-0.9.22.tar.xz -C build/craftoui
          cd build/craftoui/craftoui-source
          gradle --no-daemon -PdirectMinecraft=/tmp/no-minecraft :server:test :server:jar :api:jar
      - uses: actions/upload-artifact@v4
        with:
          name: CraftoUI-Folia-26.2-0.9.22
          path: |
            build/craftoui/craftoui-source/server/build/libs/CraftoUI-Folia-26.2-0.9.22.jar
            build/craftoui/craftoui-source/api/build/libs/CraftoUI-API-0.9.22.jar
          if-no-files-found: error
