name: Admin war and builds check

on:
  pull_request:
    paths:
      - 'modules/NeverLandTownyBuilds/**'
      - 'modules/NeverLandTownyControl/**'
      - 'modules/NeverLandTownySiegesPlus/**'
      - '.github/workflows/build-admin-testing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - run: python scripts/build_suite.py Builds SiegesPlus Control --stage dist/plugins
      - uses: actions/upload-artifact@v4
        with:
          name: NeverLand-admin-war-builds-0.52.14
          path: |
            dist/plugins/NeverLandTownyBuilds-0.11.6.jar
            dist/plugins/NeverLandTownySiegesPlus-0.6.9.jar
            dist/plugins/NeverLandTownyControl-0.6.8.jar
          if-no-files-found: error
