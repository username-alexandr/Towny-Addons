name: Chronicles hotfix

on:
  pull_request:
    paths:
      - 'modules/NeverLandTownyChronicles/**'
      - '.github/workflows/build-chronicles-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chronicles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'
      - run: python scripts/build_suite.py Chronicles --stage dist/plugins
      - uses: actions/upload-artifact@v4
        with:
          name: NeverLandTownyChronicles-hotfix
          path: dist/plugins/NeverLandTownyChronicles-*.jar
          if-no-files-found: error
