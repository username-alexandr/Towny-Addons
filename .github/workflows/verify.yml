name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML
      - run: python scripts/verify_release.py --source-only

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check selection click repeats
        shell: bash
        run: |
          mkdir -p /tmp/selection-click-test
          javac -d /tmp/selection-click-test modules/NeverLandTownyStick/src/main/java/ru/neverland/morstownstick/service/SelectionClickGate.java modules/NeverLandTownyStick/src/test/java/ru/neverland/morstownstick/SelectionClickGateSmoke.java
          java -cp /tmp/selection-click-test ru.neverland.morstownstick.SelectionClickGateSmoke
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'
      - name: Build every add-on
        shell: bash
        run: |
          set -euo pipefail
          for module in modules/*; do
            if [[ -f "$module/build.gradle.kts" ]]; then
              if [[ "${module##*/}" == "NeverLandTownyBuilds" || "${module##*/}" == "NeverLandTownyChronicles" || "${module##*/}" == "NeverLandTownyExpeditions" || "${module##*/}" == "NeverLandTownyEvents" || "${module##*/}" == "NeverLandTownyPopulation" || "${module##*/}" == "NeverLandTownyDistricts" || "${module##*/}" == "NeverLandTownyLogistics" || "${module##*/}" == "NeverLandTownyResources" || "${module##*/}" == "NeverLandTownyUpkeep" || "${module##*/}" == "NeverLandTownyPower" || "${module##*/}" == "NeverLandTownyResearch" || "${module##*/}" == "NeverLandTownySpecialization" || "${module##*/}" == "NeverLandTownyPolicies" || "${module##*/}" == "NeverLandTownyTaxes" || "${module##*/}" == "NeverLandTownyTreasuryPlus" ]]; then
                gradle --no-daemon -p "$module" clean jar smokeTest
              else
                gradle --no-daemon -p "$module" clean jar testClasses
              fi
            else
              mvn -B -f "$module/pom.xml" clean package
            fi
          done
