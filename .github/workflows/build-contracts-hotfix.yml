name: Contracts hotfix

on:
  pull_request:
    paths:
      - 'modules/NeverLandTownyContracts/**'
      - 'scripts/fishing-runtime-probe/**'
      - '.github/workflows/build-contracts-hotfix.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'
      - run: python scripts/build_suite.py Contracts --stage dist/plugins
      - uses: actions/upload-artifact@v4
        with:
          name: NeverLandTownyContracts-hotfix
          path: dist/plugins/NeverLandTownyContracts-*.jar
          if-no-files-found: error
