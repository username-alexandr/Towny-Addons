name: Verify CraftoUI

on:
  pull_request:
    paths:
      - 'integrations/CraftoUI-0.9.10/**'
      - '.github/workflows/verify-craftoui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/CraftoUI-0.9.10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: integrations/CraftoUI-0.9.10/gradle/wrapper/gradle-wrapper.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: bash ./gradlew --no-daemon clean release
      - uses: actions/upload-artifact@v4
        with:
          name: CraftoUI-0.9.10-jars
          path: integrations/CraftoUI-0.9.10/build/release/*.jar
          if-no-files-found: error
