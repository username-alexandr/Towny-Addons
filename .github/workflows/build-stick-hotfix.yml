name: Stick map hotfix

on:
  pull_request:
    paths:
      - 'modules/NeverLandTownyStick/**'
      - 'integrations/CraftoUI-0.9.15/**'
      - '.github/workflows/build-stick-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: python scripts/build_suite.py Stick --stage dist/plugins
      - uses: actions/upload-artifact@v4
        with:
          name: NeverLandTownyStick-map-hotfix
          path: dist/plugins/NeverLandTownyStick-*.jar
          if-no-files-found: error
