name: Publish release 0.7.6

on:
  push:
    branches: [release/v0.7.6]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check selection click repeats
        shell: bash
        run: |
          mkdir -p /tmp/selection-click-test
          javac -d /tmp/selection-click-test modules/NeverLandTownyStick/src/main/java/ru/neverland/morstownstick/service/SelectionClickGate.java modules/NeverLandTownyStick/src/test/java/ru/neverland/morstownstick/SelectionClickGateSmoke.java
          java -cp /tmp/selection-click-test ru.neverland.morstownstick.SelectionClickGateSmoke
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'
      - run: python -m pip install PyYAML
      - name: Build release JARs
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/plugins/*.jar
          for module in modules/*; do
            name="${module##*/}"
            version="$(python -c 'import sys,yaml; print(yaml.safe_load(open("versions.yml"))["addons"][sys.argv[1]])' "$name")"
            if [[ -f "$module/build.gradle.kts" ]]; then
              if [[ "$name" == "NeverLandTownyBuilds" || "$name" == "NeverLandTownyChronicles" || "$name" == "NeverLandTownyExpeditions" || "$name" == "NeverLandTownyEvents" ]]; then
                gradle --no-daemon -p "$module" clean jar smokeTest
              else
                gradle --no-daemon -p "$module" clean jar testClasses
              fi
              cp "$module/build/libs/$name-$version.jar" "dist/plugins/$name-$version.jar"
            else
              mvn -B -f "$module/pom.xml" clean package
              cp "$module/target/$name-$version.jar" "dist/plugins/$name-$version.jar"
            fi
          done
      - name: Verify bundled artifacts
        run: |
          python scripts/verify_release.py
      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail
          suite_version="$(tr -d '[:space:]' < VERSION)"
          work_dir="$RUNNER_TEMP/neverland-release"
          mkdir -p "$work_dir"

          zip -q -r "$work_dir/NeverLandTownySuite-${suite_version}-plugins.zip" dist/plugins
          zip -q -r "$work_dir/NeverLandTownySuite-${suite_version}-sources.zip" \
            modules docs scripts .github README.md CHANGELOG.md RELEASE_NOTES_RU.md VERSION versions.yml
          zip -q -r "$work_dir/NeverLandTownySuite-${suite_version}-full.zip" \
            modules docs scripts assets dist/plugins .github README.md CHANGELOG.md RELEASE_NOTES_RU.md VERSION versions.yml

          {
            cd dist/plugins
            sha256sum *.jar
            cd ../../assets/models
            sha256sum *.zip
            cd "$work_dir"
            sha256sum *.zip
          } > "$work_dir/SHA256SUMS.txt"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(tr -d '[:space:]' < VERSION)"
          work_dir="$RUNNER_TEMP/neverland-release"
          assets=(
            dist/plugins/*.jar
            assets/models/*.zip
            "$work_dir"/*.zip
            "$work_dir/SHA256SUMS.txt"
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "NeverLand Towny Suite ${tag#v}" --notes-file RELEASE_NOTES_RU.md
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "NeverLand Towny Suite ${tag#v}" \
              --notes-file RELEASE_NOTES_RU.md
          fi
