name: Publish release

on:
  push:
    branches: [release/v0.52.4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'
      - run: python -m pip install PyYAML
      - run: python scripts/module_control.py
      - name: Build release JARs
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/plugins/*.jar
          python scripts/build_suite.py --stage dist/plugins
      - name: Verify bundled artifacts
        run: |
          python scripts/verify_release.py
          python scripts/release_metadata.py
      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail
          suite_version="$(tr -d '[:space:]' < VERSION)"
          work_dir="$RUNNER_TEMP/neverland-release"
          mkdir -p "$work_dir"

          python scripts/package_release.py --output "$work_dir"
          cp build/suite-tests.json build/api-source-inventory.json "$work_dir/"
          cp dist/plugins/VALIDATION.txt versions.yml RELEASE_NOTES_RU.md "$work_dir/"

          {
            cd dist/plugins
            sha256sum *.jar
            cd ../../assets/models
            sha256sum *.zip
            cd "$work_dir"
            sha256sum *.zip
          } > "$work_dir/SHA256SUMS.txt"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(tr -d '[:space:]' < VERSION)"
          work_dir="$RUNNER_TEMP/neverland-release"
          assets=(
            "$work_dir/suite-tests.json"
            "$work_dir/api-source-inventory.json"
            "$work_dir/VALIDATION.txt"
            "$work_dir/versions.yml"
            "$work_dir/RELEASE_NOTES_RU.md"
            modules/NeverLandTownyBuilds/build/reports/resource-balance.csv
            dist/plugins/*.jar
            assets/models/*.zip
            "$work_dir"/*.zip
            "$work_dir/SHA256SUMS.txt"
          )

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$work_dir/release.json" 2>/dev/null; then
            python -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["draft"], "Refusing to overwrite a published release"; assert r["target_commitish"]==sys.argv[2], "Draft belongs to a different commit"' "$work_dir/release.json" "$GITHUB_SHA"
          else
            gh release create "$tag" --draft \
              --target "$GITHUB_SHA" \
              --title "NeverLand Towny Suite ${tag#v}" \
              --notes-file RELEASE_NOTES_RU.md
          fi

          gh release upload "$tag" "${assets[@]}" --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$work_dir/release.json"
          python scripts/verify_published_assets.py "$work_dir/release.json" "${assets[@]}"
          release_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$work_dir/release.json")"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false -f make_latest=true >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-release-verification
          path: |
            build/suite-tests.json
            build/api-source-inventory.json
            dist/plugins/VALIDATION.txt
            dist/plugins/SHA256SUMS.txt
