name: Publish release

on:
  push:
    branches: [release/v0.37.0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'
      - run: python -m pip install PyYAML
      - run: python scripts/module_control.py
      - name: Build release JARs
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/plugins/*.jar
          python scripts/build_suite.py --stage dist/plugins
      - name: Verify bundled artifacts
        run: |
          python scripts/verify_release.py
      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail
          suite_version="$(tr -d '[:space:]' < VERSION)"
          work_dir="$RUNNER_TEMP/neverland-release"
          mkdir -p "$work_dir"

          python scripts/package_release.py --output "$work_dir"

          {
            cd dist/plugins
            sha256sum *.jar
            cd ../../assets/models
            sha256sum *.zip
            cd "$work_dir"
            sha256sum *.zip
          } > "$work_dir/SHA256SUMS.txt"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(tr -d '[:space:]' < VERSION)"
          work_dir="$RUNNER_TEMP/neverland-release"
          assets=(
            build/suite-tests.json
            build/api-source-inventory.json
            modules/NeverLandTownyBuilds/build/reports/resource-balance.csv
            dist/plugins/*.jar
            assets/models/*.zip
            "$work_dir"/*.zip
            "$work_dir/SHA256SUMS.txt"
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "NeverLand Towny Suite ${tag#v}" --notes-file RELEASE_NOTES_RU.md
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "NeverLand Towny Suite ${tag#v}" \
              --notes-file RELEASE_NOTES_RU.md
          fi
