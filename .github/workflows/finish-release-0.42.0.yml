name: Finish verified release 0.42.0
on:
  push:
    branches: [publish/v0.42.0]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: finish-release-0.42.0
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML
      - name: Verify saved build and finish draft publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/finish_release_042.py
