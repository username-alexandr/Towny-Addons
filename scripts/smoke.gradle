// Shared syntax-based discovery; each executable test runs in its own JVM.
plugins.withId('java') {
    configurations.testCompileClasspath.extendsFrom(configurations.compileOnly)
    configurations.testRuntimeClasspath.extendsFrom(configurations.compileOnly)
    tasks.register('smokeTest', Exec) {
        dependsOn tasks.named('testClasses')
        doFirst {
            commandLine System.getenv('PYTHON') ?: 'python3', file('../../scripts/run_smoke.py').absolutePath,
                '--module', projectDir.absolutePath, '--classpath', sourceSets.test.runtimeClasspath.asPath
        }
    }
}
