id: help
title: Где найти нужное
theme: dark
width: 620
height: 420
permission: craftoui.use
footer: M или /menu — главное меню. K — поиск и избранное.
components:
  - id: help_text
    type: text
    x: 24
    y: 62
    w: 572
    h: 270
    wrap: true
    text: |
      Личные заказы → доска /orders: задания для вашего заработка.
      Работа и торговля → профессии, рынок и городские контракты.
      Мой город → склад, постройки, казна, районы и развитие.
      Жители и власть → Городской совет → назначения на должности.
      Жители и власть → Министры города → управление министрами.
      Задания и события → совместные задачи и приключения.

      «Назад» или Backspace — предыдущий экран. Esc — в игру.
      Поиск / ★ — поиск разделов и закрепление избранного.
      Панель заказов в K настраивает HUD, а не открывает доску.
      Серые кнопки: наведите курсор, чтобы прочитать причину.
  - id: home
    type: button
    x: 24
    y: 345
    w: 180
    h: 28
    text: Главное меню
    action: hub:hub
